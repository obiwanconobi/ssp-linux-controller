name: Build desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check release version sources
        shell: bash
        run: |
          set -euo pipefail
          tauri_version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          ui_version=$(node -p "require('./apps/desktop/ui/package.json').version")
          cargo_version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          echo "tauri.conf.json:      ${tauri_version}"
          echo "ui/package.json:      ${ui_version}"
          echo "workspace Cargo.toml: ${cargo_version}"
          if [ -z "${cargo_version}" ]; then
            echo "::error::Could not read the workspace version from Cargo.toml."
            exit 1
          fi
          if [ "${ui_version}" != "${tauri_version}" ] || [ "${cargo_version}" != "${tauri_version}" ]; then
            echo "::error::Version mismatch: tauri.conf.json=${tauri_version}, ui/package.json=${ui_version}, Cargo.toml=${cargo_version}."
            exit 1
          fi

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match v${version} from tauri.conf.json."
            exit 1
          fi
          echo "Tag ${TAG} matches tauri.conf.json."

  ui:
    name: UI checks
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/desktop/ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop/ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Type-check and build
        working-directory: apps/desktop/ui
        run: pnpm build

      - name: Unit tests
        working-directory: apps/desktop/ui
        run: pnpm test

      - name: UI smoke
        working-directory: apps/desktop/ui
        run: pnpm test:ui

      - name: Startup smoke
        working-directory: apps/desktop/ui
        run: pnpm test:startup

      - name: Accessibility smoke
        working-directory: apps/desktop/ui
        run: pnpm test:a11y

      - name: Keyboard smoke
        working-directory: apps/desktop/ui
        run: pnpm test:keyboard

      - name: Focused and state visuals
        working-directory: apps/desktop/ui
        run: pnpm test:states

      - name: Visual regression baselines
        working-directory: apps/desktop/ui
        run: pnpm test:visual

      - name: Performance budgets
        working-directory: apps/desktop/ui
        run: pnpm test:perf

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: linux-x64
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: windows-x64
          - name: macOS x64 (Intel)
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: macos-x64
          - name: macOS arm64 (Apple Silicon)
            platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Set up Rust
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the runner's installed stable toolchain. This avoids a
          # needless rustup channel sync on every job and keeps transient
          # static.rust-lang.org DNS failures from failing the build.
          if ! command -v rustup >/dev/null 2>&1; then
            rustc --version
            cargo --version
            exit 0
          fi
          if ! rustup toolchain list | grep -q '^stable'; then
            for attempt in 1 2 3 4 5; do
              if rustup toolchain install stable --profile minimal --no-self-update; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              echo "rustup toolchain install failed (attempt ${attempt}/5); retrying in 30s" >&2
              sleep 30
            done
          fi
          rustup default stable
          if ! rustup target list --installed | grep -qx "${{ matrix.target }}"; then
            for attempt in 1 2 3 4 5; do
              if rustup target add "${{ matrix.target }}"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                exit 1
              fi
              echo "rustup target add failed (attempt ${attempt}/5); retrying in 30s" >&2
              sleep 30
            done
          fi
          rustc --version
          cargo --version

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libudev-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            libfuse2 \
            xdg-utils

      - name: Install frontend dependencies
        working-directory: apps/desktop/ui
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc sign the macOS bundles so the arm64 app launches on Apple
          # Silicon. Replace with a Developer ID identity and notarization
          # credentials before distributing publicly.
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          retryAttempts: 2

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe artifacts/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          ls -lh artifacts

      - name: Verify macOS bundle architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-*) expected=arm64 ;;
            x86_64-*) expected=x86_64 ;;
            *) echo "Unexpected target: ${{ matrix.target }}"; exit 1 ;;
          esac
          binary=$(find "target/${{ matrix.target }}/release/bundle/macos/StompStation.app/Contents/MacOS" -maxdepth 1 -type f -print -quit)
          actual=$(lipo -archs "$binary")
          echo "$binary -> $actual (expected $expected)"
          test "$actual" = "$expected"

      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          case "${{ matrix.target }}" in
            aarch64-*) arch=aarch64 ;;
            x86_64-*) arch=x64 ;;
          esac
          ditto -c -k --sequesterRsrc --keepParent \
            "target/${{ matrix.target }}/release/bundle/macos/StompStation.app" \
            "artifacts/StompStation_${version}_${arch}.app.zip"
          ls -lh artifacts

      - name: Upload executable and bundles
        uses: actions/upload-artifact@v4
        with:
          name: stompstation-${{ matrix.artifact }}
          if-no-files-found: error
          path: artifacts/

  release:
    name: Publish release
    needs: [version, build, ui]
    if: |
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match v${version} from tauri.conf.json."
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag="${{ github.ref_name }}"
          else
            version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
            tag="v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${tag}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release assets were downloaded."
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --title "StompStation $TAG" \
              --generate-notes \
              --target "${{ github.sha }}"
          fi
