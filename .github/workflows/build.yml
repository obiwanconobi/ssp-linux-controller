name: Build desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: linux-x64
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: windows-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libudev-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            libfuse2 \
            xdg-utils

      - name: Install frontend dependencies
        working-directory: apps/desktop/ui
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('StompStation {0}', github.ref_name) || '' }}
          releaseBody: 'Windows and Linux desktop builds for StompStation.'
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.platform }}" = "ubuntu-22.04" ]; then
            ls target/${{ matrix.target }}/release/bundle/deb/*.deb
            ls target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          else
            ls target/${{ matrix.target }}/release/bundle/msi/*.msi
            ls target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          fi
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe artifacts/ 2>/dev/null || true
          ls -lh artifacts

      - name: Upload executable and bundles
        uses: actions/upload-artifact@v4
        with:
          name: stompstation-${{ matrix.artifact }}
          if-no-files-found: error
          path: artifacts/
