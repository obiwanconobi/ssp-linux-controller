[package]
name = "stompstation-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "StompStation PRO desktop controller"
default-run = "stompstation-desktop"

[lib]
name = "stompstation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
stomp-protocol = { path = "../../../crates/stomp-protocol" }
stomp-upload = { path = "../../../crates/stomp-upload" }
stomp-eq = { path = "../../../crates/stomp-eq" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
stomp-transport = { path = "../../../crates/stomp-transport", features = ["mdns"] }
stomp-device = { path = "../../../crates/stomp-device" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
stomp-transport = { path = "../../../crates/stomp-transport", default-features = false, features = ["mdns"] }
stomp-device = { path = "../../../crates/stomp-device", default-features = false }
